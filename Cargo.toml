[package]
name = "gitlab-for-mac"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native macOS GitLab ops console using glab auth"
license = "MIT"
publish = false

[dependencies]
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component", "assets", "syntect"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "io-util", "rt-multi-thread", "time", "sync", "macros"] }
dirs = "6"
open = "5"
url = "2"
urlencoding = "2"

[dev-dependencies]
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component", "assets", "syntect", "test-support"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
