name: Post-Merge CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_canary:
        description: "Update the rolling canary GitHub Pre-release (main branch only)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: post-merge-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard-and-security:
    name: Branch Guard, Hygiene & Security (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Enforce main-branch-only execution
        shell: bash
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Post-Merge CD may only run on refs/heads/main (got '${CURRENT_REF}')."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository hygiene and merged-commit audit
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_range=""
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            commit_range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          COMMIT_RANGE="$commit_range" .github/scripts/check-repo-hygiene.sh

      - name: Scan repository for leaked secrets (Gitleaks)
        uses: ./.github/actions/gitleaks-scan
        with:
          mode: full

      - name: Audit dependencies (cargo-deny)
        uses: ./.github/actions/cargo-deny-check

  verify-main:
    name: Verify main & Warm PR Cache (macos-15)
    needs: [guard-and-security]
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Rust toolchain with Intel cross-check target
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Warm shared macOS dev cache for PRs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-15-dev
          cache-on-failure: false

      - name: Check production targets without dev-dependency leakage
        shell: bash
        run: cargo clippy --locked --lib --bins -- -D warnings

      - name: Check all targets with Clippy
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run full test suite on merged main
        shell: bash
        run: cargo test --locked

      - name: Verify Rustdoc builds cleanly
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

      - name: Cross-check Intel macOS target compilation
        shell: bash
        run: cargo check --locked --target x86_64-apple-darwin

  build-canary:
    name: Build Hermetic Canary Binary (arm64, no secrets)
    needs: [guard-and-security, verify-main]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      crate_version: ${{ steps.build.outputs.crate-version }}
      canary_version: ${{ steps.meta.outputs.canary_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      binary_sha256: ${{ steps.build.outputs.binary-sha256 }}
      binary_size_mb: ${{ steps.build.outputs.binary-size-mb }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build LTO release binary (isolated from signing secrets)
        id: build
        uses: ./.github/actions/rust-release-build
        with:
          target: aarch64-apple-darwin
          run-verify: "false"

      - name: Derive canary metadata
        id: meta
        shell: bash
        env:
          CRATE_VERSION: ${{ steps.build.outputs.crate-version }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          {
            echo "short_sha=${short_sha}"
            echo "canary_version=${CRATE_VERSION}-canary.${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned binary for isolated signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-canary-arm64
          path: target/aarch64-apple-darwin/release/gitlab-for-mac
          retention-days: 1
          if-no-files-found: error

  sign-and-package-canary:
    name: Sign & Package Canary (arm64, zero cargo)
    needs: [build-canary]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    # Uncomment once repo is public or on GitHub Pro/Team to scope signing secrets to a protected environment:
    # environment: canary
    permissions:
      contents: read
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.checksums_sha256 }}
    steps:
      - name: Checkout trusted packaging scripts and assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-canary-arm64
          path: unsigned

      - name: Verify downloaded binary SHA-256 against build job output
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build-canary.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          chmod 755 unsigned/gitlab-for-mac
          actual=$(shasum -a 256 unsigned/gitlab-for-mac | awk '{print $1}')
          if [[ "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Binary digest mismatch (expected ${EXPECTED_SHA256}, got ${actual})."
            exit 1
          fi

      - name: Provision temporary Apple signing keychain (if configured)
        uses: ./.github/actions/macos-signing-keychain
        with:
          mode: setup
          require-signing: "false"
          cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Package signed macOS .app, .dmg, and CLI archive
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CANARY_VERSION: ${{ needs.build-canary.outputs.canary_version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          .github/scripts/package-macos.sh \
            --binary unsigned/gitlab-for-mac \
            --version "$CANARY_VERSION" \
            --tag canary \
            --arch arm64 \
            --target aarch64-apple-darwin \
            --build-number "$GITHUB_RUN_NUMBER" \
            --out-dir dist

      - name: Clean up temporary signing keychain
        if: always()
        uses: ./.github/actions/macos-signing-keychain
        with:
          mode: cleanup

      - name: Record immutable checksums manifest digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          sum=$(shasum -a 256 dist/SHA256SUMS-arm64.txt | awk '{print $1}')
          echo "checksums_sha256=${sum}" >> "$GITHUB_OUTPUT"

      - name: Upload packaged canary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitlab-for-mac-canary-arm64
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  publish-canary:
    name: Publish Rolling Canary Pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-canary, sign-and-package-canary]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_canary == true)
    # Uncomment once repo is public or on GitHub Pro/Team:
    # environment: canary
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged canary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitlab-for-mac-canary-arm64
          path: dist

      - name: Verify checksum manifest against sign job output
        shell: bash
        env:
          EXPECTED_SUM: ${{ needs.sign-and-package-canary.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          cd dist
          actual=$(sha256sum SHA256SUMS-arm64.txt | awk '{print $1}')
          if [[ "$actual" != "$EXPECTED_SUM" ]]; then
            echo "::error::SHA256SUMS-arm64.txt digest mismatch."
            exit 1
          fi
          cp SHA256SUMS-arm64.txt SHA256SUMS.txt
          rm -f SHA256SUMS-arm64.txt
          sha256sum -c SHA256SUMS.txt

      - name: Guard against rolling canary downgrade
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_tip=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_tip" != "$TARGET_SHA" ]]; then
            echo "::error::Refusing to publish canary for stale commit ${TARGET_SHA}; main tip is ${main_tip}."
            exit 1
          fi

      - name: Generate SLSA build provenance attestation
        if: github.event.repository.visibility == 'public' || vars.ENABLE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz

      - name: Point rolling canary tag to verified main tip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref_state=$(gh api "repos/${REPO}/git/ref/tags/canary" \
            --jq 'if type == "object" and .ref == "refs/tags/canary" then "exists" else "missing" end' 2>/dev/null || echo "missing")
          if [[ "$ref_state" == "exists" ]]; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/canary" \
              -f sha="${TARGET_SHA}" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/canary" \
              -f sha="${TARGET_SHA}" >/dev/null
          fi

      - name: Prepare canary release notes
        shell: bash
        env:
          CANARY_VERSION: ${{ needs.build-canary.outputs.canary_version }}
          SHORT_SHA: ${{ needs.build-canary.outputs.short_sha }}
          BINARY_SIZE_MB: ${{ needs.build-canary.outputs.binary_size_mb }}
        run: |
          cat > release-notes.md <<EOF
          ## Rolling Canary Build (\`${CANARY_VERSION}\`)

          Automated post-merge build from \`main\` commit \`${GITHUB_SHA}\` (\`${SHORT_SHA}\`).

          - **Architecture:** Apple Silicon (\`aarch64-apple-darwin\`, macOS 13.0+)
          - **Stripped LTO Binary Size:** ${BINARY_SIZE_MB} MB
          - **Verification:** \`clippy --lib --bins\`, \`clippy --all-targets\`, \`cargo test --locked\`, \`cargo doc\`, Intel cross-check, \`cargo-deny\`, \`gitleaks\`

          ### SHA-256 Checksums
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Publish rolling canary pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: canary
          target_commitish: ${{ github.sha }}
          name: "GitLab for Mac Canary (${{ needs.build-canary.outputs.short_sha }})"
          prerelease: true
          make_latest: "false"
          body_path: release-notes.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/GitLab-for-Mac-canary-arm64.app.zip
            dist/GitLab-for-Mac-canary-arm64.dmg
            dist/gitlab-for-mac-canary-aarch64-apple-darwin.tar.gz
            dist/SHA256SUMS.txt
