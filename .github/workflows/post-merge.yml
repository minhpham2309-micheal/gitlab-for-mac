name: Post-Merge CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_canary:
        description: "Update the rolling canary GitHub Pre-release"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: post-merge-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  security-main:
    name: Security & Hygiene (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository hygiene audit
        shell: bash
        run: .github/scripts/check-repo-hygiene.sh

      - name: Scan repository for leaked secrets (Gitleaks)
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "${tmp}/${archive}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${archive}" | sha256sum -c -
          tar -xzf "${tmp}/${archive}" -C "$tmp" gitleaks
          "${tmp}/gitleaks" git --config=.gitleaks.toml --redact .

      - name: Install cargo-deny
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny

      - name: Run cargo-deny audit
        shell: bash
        run: cargo deny --locked check

  build-and-package:
    name: Verify & Package macOS Canary (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      crate_version: ${{ steps.meta.outputs.crate_version }}
      canary_version: ${{ steps.meta.outputs.canary_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      binary_size_mb: ${{ steps.metrics.outputs.binary_size_mb }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry and release build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-15-main-release
          cache-on-failure: true

      - name: Extract crate metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          short_sha="${GITHUB_SHA:0:7}"
          echo "crate_version=${crate_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "canary_version=${crate_version}-canary.${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify Clippy lints on merged main
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run full test suite on merged main
        shell: bash
        run: cargo test --locked

      - name: Verify Rustdoc on merged main
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

      - name: Build optimized LTO release binary (aarch64-apple-darwin)
        shell: bash
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Record release binary metrics
        id: metrics
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/gitlab-for-mac"
          bytes=$(stat -f%z "$bin")
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "binary_size_mb=${mb}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release Binary Metrics"
            echo ""
            echo "- **Target:** \`aarch64-apple-darwin\`"
            echo "- **Binary Size (LTO + stripped):** ${mb} MB (${bytes} bytes)"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import Apple Developer certificate (if configured)
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERT_P12_BASE64" || -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "No Developer ID certificate configured; proceeding with ad-hoc signing."
            exit 0
          fi
          keychain="${RUNNER_TEMP}/app-signing.keychain-db"
          cert_file="${RUNNER_TEMP}/signing-cert.p12"
          kc_pass=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$cert_file"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$cert_file" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$cert_file"

      - name: Package macOS .app, .dmg, and CLI archive
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.meta.outputs.canary_version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          .github/scripts/package-macos.sh \
            --binary target/aarch64-apple-darwin/release/gitlab-for-mac \
            --version "$CANARY_VERSION" \
            --tag canary \
            --arch arm64 \
            --target aarch64-apple-darwin \
            --out-dir dist

      - name: Clean up temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/app-signing.keychain-db" ]]; then
            security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
          fi
          rm -f "${RUNNER_TEMP}/signing-cert.p12"

      - name: Upload packaged canary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitlab-for-mac-canary-arm64
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  publish-canary:
    name: Publish Rolling Canary Pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security-main, build-and-package]
    if: github.event_name == 'push' || inputs.publish_canary == true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged canary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitlab-for-mac-canary-arm64
          path: dist

      - name: Finalize SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cp SHA256SUMS-arm64.txt SHA256SUMS.txt
          rm -f SHA256SUMS-arm64.txt
          sha256sum -c SHA256SUMS.txt

      - name: Generate SLSA build provenance attestation
        if: github.event.repository.visibility == 'public' || vars.ENABLE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz

      - name: Point rolling canary tag to merged commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/tags/canary" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/canary" \
              -f sha="${TARGET_SHA}" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/canary" \
              -f sha="${TARGET_SHA}" >/dev/null
          fi

      - name: Prepare canary release notes
        shell: bash
        env:
          CANARY_VERSION: ${{ needs.build-and-package.outputs.canary_version }}
          SHORT_SHA: ${{ needs.build-and-package.outputs.short_sha }}
          BINARY_SIZE_MB: ${{ needs.build-and-package.outputs.binary_size_mb }}
        run: |
          cat > release-notes.md <<EOF
          ## Rolling Canary Build (\`${CANARY_VERSION}\`)

          Automated post-merge build from \`main\` commit \`${GITHUB_SHA}\` (\`${SHORT_SHA}\`).

          - **Architecture:** Apple Silicon (\`aarch64-apple-darwin\`)
          - **Stripped LTO Binary Size:** ${BINARY_SIZE_MB} MB
          - **Verification:** \`cargo clippy --locked --all-targets -- -D warnings\`, \`cargo test --locked\`, \`cargo doc\`, \`cargo-deny\`, \`gitleaks\`

          ### SHA-256 Checksums
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Publish rolling canary pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: canary
          name: "GitLab for Mac Canary (${{ needs.build-and-package.outputs.short_sha }})"
          prerelease: true
          make_latest: "false"
          body_path: release-notes.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/GitLab-for-Mac-canary-arm64.app.zip
            dist/GitLab-for-Mac-canary-arm64.dmg
            dist/gitlab-for-mac-canary-aarch64-apple-darwin.tar.gz
            dist/SHA256SUMS.txt
