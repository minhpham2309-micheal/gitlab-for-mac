name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag matching Cargo.toml (e.g. v0.1.0)"
        required: true
        type: string
      draft:
        description: "Publish as draft GitHub Release"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  validate-release:
    name: Validate Release Tag & Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches Cargo.toml
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${tag}' does not match SemVer format vX.Y.Z[-prerelease]."
            exit 1
          fi
          version="${tag#v}"
          crate_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ "$version" != "$crate_version" ]]; then
            echo "::error::Tag version (${version}) does not match Cargo.toml version (${crate_version})."
            exit 1
          fi
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Install cargo-deny
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny

      - name: Audit dependencies before release
        shell: bash
        run: cargo deny --locked check

  build-release:
    name: Build macOS (${{ matrix.arch }})
    needs: [validate-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Cargo registry and release target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Verify Clippy and Tests on ${{ matrix.arch }}
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build LTO release binary (${{ matrix.target }})
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Import Apple Developer certificate (if configured)
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERT_P12_BASE64" || -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "No Developer ID certificate configured; proceeding with ad-hoc signing."
            exit 0
          fi
          keychain="${RUNNER_TEMP}/app-signing.keychain-db"
          cert_file="${RUNNER_TEMP}/signing-cert.p12"
          kc_pass=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$cert_file"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$cert_file" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$cert_file"

      - name: Package macOS release artifacts (${{ matrix.arch }})
        shell: bash
        env:
          REL_VERSION: ${{ needs.validate-release.outputs.version }}
          REL_TAG: ${{ needs.validate-release.outputs.tag }}
          REL_ARCH: ${{ matrix.arch }}
          REL_TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          .github/scripts/package-macos.sh \
            --binary "target/${REL_TARGET}/release/gitlab-for-mac" \
            --version "$REL_VERSION" \
            --tag "$REL_TAG" \
            --arch "$REL_ARCH" \
            --target "$REL_TARGET" \
            --out-dir dist

      - name: Clean up temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/app-signing.keychain-db" ]]; then
            security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
          fi
          rm -f "${RUNNER_TEMP}/signing-cert.p12"

      - name: Upload release artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-release, build-release]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Combine and verify SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          sha256sum -c SHA256SUMS.txt

      - name: Generate SLSA build provenance attestation
        if: github.event.repository.visibility == 'public' || vars.ENABLE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: "GitLab for Mac ${{ needs.validate-release.outputs.tag }}"
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/GitLab-for-Mac-*.app.zip
            dist/GitLab-for-Mac-*.dmg
            dist/gitlab-for-mac-*.tar.gz
            dist/SHA256SUMS.txt
