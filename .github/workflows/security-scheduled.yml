name: Scheduled Security Audit

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-scheduled
  cancel-in-progress: true

jobs:
  audit:
    name: Weekly Advisory & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history and working tree for secrets (Gitleaks)
        uses: ./.github/actions/gitleaks-scan
        with:
          mode: full

      - name: Check RustSec advisories, licenses, bans, and sources (cargo-deny)
        uses: ./.github/actions/cargo-deny-check

  notify-failure:
    name: Alert on Scheduled Audit Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [audit]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open or update security alert issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[Security] Weekly scheduled security audit failed"
          body="The weekly scheduled security audit failed on \`main\`. Review the workflow run logs immediately: ${RUN_URL}"
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
