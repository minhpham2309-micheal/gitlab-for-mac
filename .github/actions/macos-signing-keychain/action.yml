name: macOS Signing Keychain
description: Imports or cleans up an isolated temporary Apple Developer ID keychain with strict secret validation.

inputs:
  mode:
    description: "'setup' or 'cleanup'"
    required: true
  require-signing:
    description: "Fail if Apple Developer signing credentials are absent"
    required: false
    default: "false"
  cert-p12-base64:
    description: "Base64-encoded Developer ID Application .p12 certificate"
    required: false
    default: ""
  cert-password:
    description: "Password for the .p12 certificate"
    required: false
    default: ""
  signing-identity:
    description: "Expected codesigning identity name"
    required: false
    default: ""

outputs:
  signing-enabled:
    description: "'true' if Developer ID signing keychain was provisioned"
    value: ${{ steps.keychain.outputs.signing_enabled }}

runs:
  using: composite
  steps:
    - name: Manage temporary macOS signing keychain
      id: keychain
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        REQUIRE_SIGNING: ${{ inputs.require-signing }}
        MACOS_CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        MACOS_CERT_PASSWORD: ${{ inputs.cert-password }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.signing-identity }}
      run: |
        set -euo pipefail
        umask 077

        keychain="${RUNNER_TEMP}/app-signing.keychain-db"
        orig_list="${RUNNER_TEMP}/orig-keychains.txt"
        cert_file="${RUNNER_TEMP}/signing-cert.p12"

        if [[ "$MODE" == "cleanup" ]]; then
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" 2>/dev/null || true
          fi
          if [[ -f "$orig_list" ]]; then
            orig_kcs=()
            while IFS= read -r kc; do
              [[ -n "$kc" ]] && orig_kcs+=("$kc")
            done < "$orig_list"
            if (( ${#orig_kcs[@]} > 0 )); then
              security list-keychains -d user -s "${orig_kcs[@]}" 2>/dev/null || true
              security default-keychain -d user -s "${orig_kcs[0]}" 2>/dev/null || true
            fi
            rm -f "$orig_list"
          fi
          rm -f "$cert_file"
          echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$MODE" != "setup" ]]; then
          echo "::error::Unsupported keychain mode: ${MODE}"
          exit 1
        fi

        has_p12=0; [[ -n "$MACOS_CERT_P12_BASE64" ]] && has_p12=1
        has_pw=0;  [[ -n "$MACOS_CERT_PASSWORD" ]] && has_pw=1
        has_id=0;  [[ -n "$APPLE_SIGNING_IDENTITY" ]] && has_id=1
        set_count=$((has_p12 + has_pw + has_id))

        if (( set_count == 0 )); then
          if [[ "$REQUIRE_SIGNING" == "true" ]]; then
            echo "::error::Signing is required (REQUIRE_MACOS_SIGNING=true) but Apple Developer secrets are not configured."
            exit 1
          fi
          echo "No Developer ID signing secrets configured; proceeding with ad-hoc signing."
          echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if (( set_count != 3 )); then
          echo "::error::Partial Apple signing secrets detected (cert=${has_p12}, password=${has_pw}, identity=${has_id}). Configure all three or none."
          exit 1
        fi

        trap 'rm -f "$cert_file"' EXIT
        printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert_file"

        # Preserve existing user keychain search list so login.keychain-db is never lost.
        orig_kcs=()
        while IFS= read -r line; do
          kc=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          [[ -n "$kc" ]] && orig_kcs+=("$kc")
        done < <(security list-keychains -d user)
        printf '%s\n' "${orig_kcs[@]}" > "$orig_list"

        kc_pass=$(openssl rand -hex 24)
        security create-keychain -p "$kc_pass" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$kc_pass" "$keychain"
        security import "$cert_file" -P "$MACOS_CERT_PASSWORD" -t cert -f pkcs12 -k "$keychain" \
          -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
        security list-keychains -d user -s "$keychain" "${orig_kcs[@]}"
        security default-keychain -d user -s "$keychain"

        if ! security find-identity -v -p codesigning "$keychain" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
          echo "::error::Configured APPLE_SIGNING_IDENTITY was not found in imported keychain."
          exit 1
        fi

        echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
