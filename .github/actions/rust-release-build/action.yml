name: Rust macOS Release Build
description: Runs clean hermetic verification and LTO release build (zero signing secrets) and emits immutable SHA-256 digest.

inputs:
  target:
    description: "Rust target triple (aarch64-apple-darwin or x86_64-apple-darwin)"
    required: true
  run-verify:
    description: "Whether to run clippy, test, and doc before building release"
    required: false
    default: "true"

outputs:
  crate-version:
    description: "SemVer package version from Cargo.toml"
    value: ${{ steps.build.outputs.crate_version }}
  binary-sha256:
    description: "Immutable SHA-256 hex digest of the compiled release binary"
    value: ${{ steps.build.outputs.binary_sha256 }}
  binary-size-mb:
    description: "Release binary size in MiB"
    value: ${{ steps.build.outputs.binary_size_mb }}

runs:
  using: composite
  steps:
    - name: Setup pinned Rust toolchain
      uses: ./.github/actions/setup-rust
      with:
        targets: ${{ inputs.target }}

    - name: Cache Cargo registry only (hermetic target/ build)
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: registry-only-${{ inputs.target }}
        cache-targets: false
        cache-on-failure: false

    - name: Verify, build LTO release binary, and compute SHA-256
      id: build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RUN_VERIFY: ${{ inputs.run-verify }}
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CARGO_TERM_COLOR: always
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
        if [[ ! "$crate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid crate version from Cargo.toml: ${crate_version}"
          exit 1
        fi

        if [[ "$RUN_VERIFY" == "true" ]]; then
          cargo clippy --locked --lib --bins -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
        fi

        cargo build --release --locked --target "$TARGET"
        bin="target/${TARGET}/release/gitlab-for-mac"
        "$bin" --version

        bytes=$(stat -f%z "$bin")
        mb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
        sha256=$(shasum -a 256 "$bin" | awk '{print $1}')

        {
          echo "crate_version=${crate_version}"
          echo "binary_sha256=${sha256}"
          echo "binary_size_mb=${mb}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Release Build Metrics (\`${TARGET}\`)"
          echo ""
          echo "- **Version:** \`${crate_version}\`"
          echo "- **Stripped LTO Size:** ${mb} MB (${bytes} bytes)"
          echo "- **SHA-256:** \`${sha256}\`"
        } >> "$GITHUB_STEP_SUMMARY"
