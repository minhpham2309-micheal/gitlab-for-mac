name: Setup Pinned Rust Toolchain
description: Reads the pinned Rust channel from rust-toolchain.toml and provisions it via dtolnay/rust-toolchain.

inputs:
  targets:
    description: "Optional comma-separated Rust targets to install"
    required: false
    default: ""
  components:
    description: "Optional comma-separated rustup components to install"
    required: false
    default: "clippy"

runs:
  using: composite
  steps:
    - name: Read pinned channel from rust-toolchain.toml
      id: read
      shell: bash
      run: |
        set -euo pipefail
        channel=$(awk -F'"' '/^channel = "/ { print $2; exit }' rust-toolchain.toml)
        if [[ -z "$channel" ]]; then
          echo "::error::Failed to read channel from rust-toolchain.toml."
          exit 1
        fi
        echo "channel=${channel}" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.read.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
