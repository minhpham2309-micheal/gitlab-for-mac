# cargo-deny v2 supply-chain policy for gitlab-for-mac
# Evaluates the macOS dependency graph even when run on Linux CI runners.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Security vulnerabilities always fail CI.
# Unmaintained/unsound crates fail when directly depended on by this package.
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
