# cargo-deny v2 supply-chain policy for gitlab-for-mac
# Evaluates the macOS dependency graph even when run on Linux CI runners.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Security vulnerabilities and memory-unsoundness advisories always fail CI.
# Yanked crates also fail CI to prevent shipping recalled releases.
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "warn"
maximum-db-staleness = "P30D"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # Weak file-level copyleft used by transitive deps (cbindgen build-dep, option-ext via dirs).
  "MPL-2.0",
  "BSL-1.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  { crate = "openssl", reason = "Use rustls-tls exclusively per Cargo.toml" },
  { crate = "openssl-sys", reason = "Use rustls-tls exclusively per Cargo.toml" },
  { crate = "native-tls", reason = "Use rustls-tls exclusively per Cargo.toml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
